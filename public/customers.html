<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Rental OS - Customers</title>
    <link rel="stylesheet" href="/styles.css?v=20260317" />
  </head>
  <body data-page="customers">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="sidebar-brand" href="/">Car Rental OS</a>
        <p class="sidebar-subtitle">Rental operations platform</p>
        <div id="session-summary" class="sidebar-session"></div>
        <button type="button" id="logout-btn" class="logout-btn">Logout</button>
        <nav class="sidebar-menu">
          <a href="/" data-page="home">Home</a>
          <a href="/fleet.html" data-page="fleet">Fleet</a>
          <a href="/customers.html" data-page="customers">Customers</a>
          <a href="/users.html" data-page="users">Users</a>
          <a href="/reservations.html" data-page="reservations">Reservations</a>
          <a href="/maintenance.html" data-page="maintenance">Maintenance</a>
        </nav>
      </aside>

      <div class="app-main">
        <header class="container page-header">
          <h1>Customer Management</h1>
          <p class="subtitle">Register customers and keep license/contact records organized.</p>
        </header>

        <main class="container">
          <section class="grid-2">
            <article class="card">
              <h2>Add Customer</h2>
              <form id="customer-form" class="stack" method="post" action="/customers">
            <div class="grid-2">
              <label>First Name <input name="firstName" required /></label>
              <label>Last Name <input name="lastName" required /></label>
            </div>
            <div class="grid-2">
              <label>Email <input type="email" name="email" required /></label>
              <label>Phone <input name="phone" required /></label>
            </div>
            <label>License Number <input name="licenseNumber" required /></label>
                <button type="submit">Add Customer</button>
              </form>
              <div id="customer-form-message" class="soft-box"></div>
            </article>

            <article class="card">
              <h2>Overview</h2>
              <div id="customer-metrics" class="metrics-grid"></div>
            </article>
          </section>

          <section class="card">
            <h2>Customer List</h2>
            <div id="customer-list" class="table-wrap"></div>
          </section>

          <div id="toast" class="toast hidden" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <script>
      (function () {
        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function renderLegacyCustomers(customers) {
          var listContainer = document.getElementById("customer-list");
          var metricsContainer = document.getElementById("customer-metrics");
          if (!listContainer || !metricsContainer) {
            return;
          }

          if (!customers || !customers.length) {
            listContainer.innerHTML = "<p>No customers yet.</p>";
            metricsContainer.innerHTML =
              '<div class="metric"><div class="label">Total Customers</div><div class="value">0</div></div>';
            return;
          }

          var rows = [];
          for (var i = 0; i < customers.length; i += 1) {
            var customer = customers[i] || {};
            var createdAt = customer.createdAt ? String(customer.createdAt).slice(0, 10) : "n/a";
            rows.push(
              "<tr>" +
                "<td>" +
                escapeHtml((customer.firstName || "") + " " + (customer.lastName || "")) +
                "</td>" +
                "<td>" +
                escapeHtml(customer.email || "") +
                "</td>" +
                "<td>" +
                escapeHtml(customer.phone || "") +
                "</td>" +
                "<td>" +
                escapeHtml(customer.licenseNumber || "") +
                "</td>" +
                "<td>" +
                escapeHtml(createdAt) +
                "</td>" +
                "</tr>"
            );
          }

          listContainer.innerHTML =
            "<table>" +
            "<thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>License</th><th>Created</th></tr></thead>" +
            "<tbody>" +
            rows.join("") +
            "</tbody>" +
            "</table>";

          metricsContainer.innerHTML =
            '<div class="metric"><div class="label">Total Customers</div><div class="value">' +
            customers.length +
            "</div></div>";
        }

        function loadCustomersLegacy() {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", "/api/customers", true);
          xhr.withCredentials = true;
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) {
              return;
            }
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                var parsed = JSON.parse(xhr.responseText || "[]");
                if (Object.prototype.toString.call(parsed) === "[object Array]") {
                  renderLegacyCustomers(parsed);
                }
              } catch (_err) {
                // Ignore parse errors and let main bundle try rendering.
              }
            }
          };
          xhr.send();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", loadCustomersLegacy);
        } else {
          loadCustomersLegacy();
        }
      })();
    </script>
    <script src="/common.js?v=20260317"></script>
    <script src="/customers.js?v=20260317"></script>
  </body>
</html>
