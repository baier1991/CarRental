<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Rental OS - Reservations</title>
    <link rel="stylesheet" href="/styles.css?v=20260320" />
  </head>
  <body data-page="reservations">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="sidebar-brand" href="/">Car Rental OS</a>
        <p class="sidebar-subtitle">Rental operations platform</p>
        <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-expanded="false" aria-controls="sidebar-menu">
          Menu
        </button>
        <div id="session-summary" class="sidebar-session"></div>
        <button type="button" id="logout-btn" class="logout-btn">Logout</button>
        <nav id="sidebar-menu" class="sidebar-menu">
          <a href="/" data-page="home">Home</a>
          <a href="/fleet.html" data-page="fleet">Fleet</a>
          <a href="/customers.html" data-page="customers">Customers</a>
          <a href="/users.html" data-page="users">Users</a>
          <a href="/reservations.html" data-page="reservations">Reservations</a>
          <a href="/maintenance.html" data-page="maintenance">Maintenance</a>
        </nav>
      </aside>

      <div class="app-main">
        <header class="container page-header">
          <h1>Reservations & Pricing</h1>
          <p class="subtitle">Create bookings, calculate quotes, and monitor reservation pipeline.</p>
        </header>

        <main class="container">
          <section class="grid-2">
            <article class="card">
              <h2>Create Reservation</h2>
              <form id="reservation-form" class="stack">
            <label>Customer <select name="customerId" id="reservation-customer" required></select></label>
            <label style="display: inline-flex; align-items: center; gap: 0.45rem">
              <input type="checkbox" id="reservation-create-customer-inline" name="createCustomerInline" />
              Create a new customer now
            </label>
            <div id="reservation-inline-customer-fields" class="soft-box hidden">
              <div class="grid-2">
                <label>First Name <input name="inlineCustomerFirstName" /></label>
                <label>Last Name <input name="inlineCustomerLastName" /></label>
              </div>
              <div class="grid-2">
                <label>Email <input type="email" name="inlineCustomerEmail" /></label>
                <label>Phone <input name="inlineCustomerPhone" /></label>
              </div>
              <label>License Number <input name="inlineCustomerLicenseNumber" /></label>
            </div>
            <label>Vehicle <select name="vehicleId" id="reservation-vehicle" required></select></label>
            <div class="grid-2">
              <label>Start Date <input type="date" name="startDate" required /></label>
              <label>End Date <input type="date" name="endDate" required /></label>
            </div>
            <div class="grid-2">
              <label>
                Insurance
                <select name="insuranceTier">
                  <option value="basic">basic</option>
                  <option value="plus">plus</option>
                  <option value="premium">premium</option>
                </select>
              </label>
              <label>
                Status
                <select name="status">
                  <option value="pending">pending</option>
                  <option value="confirmed">confirmed</option>
                  <option value="active">active</option>
                </select>
              </label>
            </div>
            <fieldset>
              <legend>Add-ons</legend>
              <label><input type="checkbox" name="addOns" value="gps" /> GPS</label>
              <label><input type="checkbox" name="addOns" value="childSeat" /> Child Seat</label>
              <label><input type="checkbox" name="addOns" value="extraDriver" /> Extra Driver</label>
            </fieldset>
            <label>Discount Code <input name="discountCode" placeholder="WEEKLY10 or CORPORATE15" /></label>
            <label>Notes <textarea name="notes" rows="2"></textarea></label>
                <button type="submit">Create Reservation</button>
              </form>
            </article>

            <article class="card">
              <h2>Quick Quote</h2>
              <form id="quote-form" class="stack">
            <label>Vehicle <select name="vehicleId" id="quote-vehicle"></select></label>
            <div class="grid-2">
              <label>Start Date <input type="date" name="startDate" required /></label>
              <label>End Date <input type="date" name="endDate" required /></label>
            </div>
            <div class="grid-2">
              <label>
                Insurance
                <select name="insuranceTier">
                  <option value="basic">basic</option>
                  <option value="plus">plus</option>
                  <option value="premium">premium</option>
                </select>
              </label>
              <label>Discount Code <input name="discountCode" placeholder="Optional" /></label>
            </div>
            <fieldset>
              <legend>Add-ons</legend>
              <label><input type="checkbox" name="addOns" value="gps" /> GPS</label>
              <label><input type="checkbox" name="addOns" value="childSeat" /> Child Seat</label>
              <label><input type="checkbox" name="addOns" value="extraDriver" /> Extra Driver</label>
            </fieldset>
                <button type="submit">Calculate Quote</button>
              </form>
              <div id="quote-result" class="soft-box"></div>
            </article>
          </section>

          <section class="card">
            <h2>Reservations</h2>
            <div id="reservation-list" class="table-wrap"></div>
            <div id="reservation-pagination" class="pagination-wrap hidden"></div>
          </section>

          <div id="toast" class="toast hidden" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <script src="/legacy-fallback.js?v=20260320"></script>
    <script src="/common.js?v=20260320"></script>
    <script src="/reservations.js?v=20260320"></script>
  </body>
</html>
