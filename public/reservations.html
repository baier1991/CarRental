<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Rental OS - Reservations</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="top-nav">
      <div class="container nav-inner">
        <a class="brand" href="/">Car Rental OS</a>
        <div class="menu">
          <a href="/">Home</a>
          <a href="/fleet.html">Fleet</a>
          <a href="/customers.html">Customers</a>
          <a href="/reservations.html" class="active">Reservations</a>
          <a href="/maintenance.html">Maintenance</a>
        </div>
      </div>
    </nav>

    <header class="container page-header">
      <h1>Reservations & Pricing</h1>
      <p class="subtitle">Create bookings, calculate quotes, and monitor reservation pipeline.</p>
    </header>

    <main class="container">
      <section class="grid-2">
        <article class="card">
          <h2>Create Reservation</h2>
          <form id="reservation-form" class="stack">
            <label>Customer <select name="customerId" id="reservation-customer" required></select></label>
            <label>Vehicle <select name="vehicleId" id="reservation-vehicle" required></select></label>
            <div class="grid-2">
              <label>Start Date <input type="date" name="startDate" required /></label>
              <label>End Date <input type="date" name="endDate" required /></label>
            </div>
            <div class="grid-2">
              <label>
                Insurance
                <select name="insuranceTier">
                  <option value="basic">basic</option>
                  <option value="plus">plus</option>
                  <option value="premium">premium</option>
                </select>
              </label>
              <label>
                Status
                <select name="status">
                  <option value="pending">pending</option>
                  <option value="confirmed">confirmed</option>
                  <option value="active">active</option>
                </select>
              </label>
            </div>
            <fieldset>
              <legend>Add-ons</legend>
              <label><input type="checkbox" name="addOns" value="gps" /> GPS</label>
              <label><input type="checkbox" name="addOns" value="childSeat" /> Child Seat</label>
              <label><input type="checkbox" name="addOns" value="extraDriver" /> Extra Driver</label>
            </fieldset>
            <label>Discount Code <input name="discountCode" placeholder="WEEKLY10 or CORPORATE15" /></label>
            <label>Notes <textarea name="notes" rows="2"></textarea></label>
            <button type="submit">Create Reservation</button>
          </form>
        </article>

        <article class="card">
          <h2>Quick Quote</h2>
          <form id="quote-form" class="stack">
            <label>Vehicle <select name="vehicleId" id="quote-vehicle"></select></label>
            <div class="grid-2">
              <label>Start Date <input type="date" name="startDate" required /></label>
              <label>End Date <input type="date" name="endDate" required /></label>
            </div>
            <div class="grid-2">
              <label>
                Insurance
                <select name="insuranceTier">
                  <option value="basic">basic</option>
                  <option value="plus">plus</option>
                  <option value="premium">premium</option>
                </select>
              </label>
              <label>Discount Code <input name="discountCode" placeholder="Optional" /></label>
            </div>
            <fieldset>
              <legend>Add-ons</legend>
              <label><input type="checkbox" name="addOns" value="gps" /> GPS</label>
              <label><input type="checkbox" name="addOns" value="childSeat" /> Child Seat</label>
              <label><input type="checkbox" name="addOns" value="extraDriver" /> Extra Driver</label>
            </fieldset>
            <button type="submit">Calculate Quote</button>
          </form>
          <div id="quote-result" class="soft-box"></div>
        </article>
      </section>

      <section class="card">
        <h2>Reservations</h2>
        <div id="reservation-list" class="table-wrap"></div>
      </section>

      <div id="toast" class="toast hidden" aria-live="polite"></div>
    </main>

    <script src="/common.js"></script>
    <script src="/reservations.js"></script>
  </body>
</html>
