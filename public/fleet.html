<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Rental OS - Fleet</title>
    <link rel="stylesheet" href="/styles.css?v=20260321" />
  </head>
  <body data-page="fleet">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="sidebar-brand" href="/">Car Rental OS</a>
        <p class="sidebar-subtitle">Rental operations platform</p>
        <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-expanded="false" aria-controls="sidebar-menu">
          Menu
        </button>
        <div id="session-summary" class="sidebar-session"></div>
        <button type="button" id="logout-btn" class="logout-btn">Logout</button>
        <nav id="sidebar-menu" class="sidebar-menu">
          <a href="/" data-page="home">Home</a>
          <a href="/fleet.html" data-page="fleet">Fleet</a>
          <a href="/customers.html" data-page="customers">Customers</a>
          <a href="/users.html" data-page="users">Users</a>
          <a href="/reservations.html" data-page="reservations">Reservations</a>
          <a href="/maintenance.html" data-page="maintenance">Maintenance</a>
        </nav>
      </aside>

      <div class="app-main">
        <header class="container page-header">
          <div class="page-actions">
            <div>
              <h1>Fleet Management</h1>
              <p class="subtitle">Overall fleet picture, smart filters, and quick access to vehicle profiles.</p>
            </div>
            <button type="button" id="fleet-add-toggle-btn">+ Add Vehicle</button>
          </div>
        </header>

        <main class="container">
          <section class="card">
            <h2>Overall Fleet Picture</h2>
            <div id="fleet-overview-metrics" class="metrics-grid"></div>
          </section>

          <section class="card">
            <h2>Filter Fleet</h2>
            <form id="fleet-filter-form" class="stack">
              <div class="grid-3">
                <label>
                  Search
                  <input
                    type="search"
                    id="fleet-filter-search"
                    name="search"
                    placeholder="Plate, make, model, or branch"
                  />
                </label>
                <label>
                  Status
                  <select id="fleet-filter-status" name="status">
                    <option value="">All statuses</option>
                    <option value="available">available</option>
                    <option value="maintenance">maintenance</option>
                    <option value="cleaning">cleaning</option>
                    <option value="inactive">inactive</option>
                  </select>
                </label>
                <label>
                  Category
                  <select id="fleet-filter-category" name="category">
                    <option value="">All categories</option>
                  </select>
                </label>
              </div>
              <button type="button" id="fleet-filter-reset-btn">Reset Filters</button>
            </form>
          </section>

          <section id="fleet-add-panel" class="card hidden">
            <h2>Add Vehicle</h2>
            <form id="vehicle-form" class="stack">
              <div class="grid-2">
                <label>Plate Number <input name="plateNumber" required /></label>
                <label>VIN (17 chars) <input name="vin" maxlength="17" minlength="17" /></label>
              </div>
              <div class="grid-2">
                <label>Make <input name="make" required /></label>
                <label>Model <input name="model" required /></label>
              </div>
              <div class="grid-2">
                <label>Year <input type="number" name="year" min="1990" max="2100" required /></label>
                <label>
                  Category
                  <select name="category">
                    <option value="sedan">sedan</option>
                    <option value="economy">economy</option>
                    <option value="compact">compact</option>
                    <option value="suv">suv</option>
                    <option value="luxury">luxury</option>
                    <option value="van">van</option>
                    <option value="pickup">pickup</option>
                    <option value="electric">electric</option>
                  </select>
                </label>
              </div>
              <div class="grid-2">
                <label>Daily Rate <input type="number" name="dailyRate" step="0.01" required /></label>
                <label>Weekend Daily Rate <input type="number" name="weekendDailyRate" step="0.01" /></label>
              </div>
              <div class="grid-2">
                <label>
                  Status
                  <select name="status">
                    <option value="available">available</option>
                    <option value="maintenance">maintenance</option>
                    <option value="cleaning">cleaning</option>
                    <option value="inactive">inactive</option>
                  </select>
                </label>
                <label>Branch Code <input name="branchCode" placeholder="DXB-01" /></label>
              </div>
              <label>Location <input name="location" required /></label>
              <fieldset>
                <legend>Vehicle Features</legend>
                <label><input type="checkbox" name="features" value="bluetooth" /> Bluetooth</label>
                <label><input type="checkbox" name="features" value="appleCarPlay" /> Apple CarPlay</label>
                <label><input type="checkbox" name="features" value="androidAuto" /> Android Auto</label>
                <label><input type="checkbox" name="features" value="backupCamera" /> Backup Camera</label>
                <label><input type="checkbox" name="features" value="cruiseControl" /> Cruise Control</label>
                <label><input type="checkbox" name="features" value="parkingSensors" /> Parking Sensors</label>
              </fieldset>
              <button type="submit">Save Vehicle</button>
            </form>
          </section>

          <section class="card">
            <h2>Fleet List</h2>
            <div id="vehicle-list" class="table-wrap"></div>
            <div id="vehicle-pagination" class="pagination-wrap hidden"></div>
          </section>

          <div id="toast" class="toast hidden" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <script src="/common.js?v=20260328"></script>
    <script src="/fleet.js?v=20260328"></script>
    <script src="/ui-fallback.js?v=20260328"></script>
  </body>
</html>
