<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Rental OS - Users</title>
    <link rel="stylesheet" href="/styles.css?v=20260314" />
  </head>
  <body data-page="users">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="sidebar-brand" href="/">Car Rental OS</a>
        <p class="sidebar-subtitle">Rental operations platform</p>
        <div id="session-summary" class="sidebar-session"></div>
        <button type="button" id="logout-btn" class="logout-btn">Logout</button>
        <nav class="sidebar-menu">
          <a href="/" data-page="home">Home</a>
          <a href="/fleet.html" data-page="fleet">Fleet</a>
          <a href="/customers.html" data-page="customers">Customers</a>
          <a href="/users.html" data-page="users">Users</a>
          <a href="/reservations.html" data-page="reservations">Reservations</a>
          <a href="/maintenance.html" data-page="maintenance">Maintenance</a>
        </nav>
      </aside>

      <div class="app-main">
        <header class="container page-header">
          <h1>User Management</h1>
          <p class="subtitle">Manage client users and permissions inside this tenant.</p>
        </header>

        <main class="container">
          <section class="grid-2">
            <article class="card">
              <h2>Create User</h2>
              <form id="user-form" class="stack">
                <div class="grid-2">
                  <label>First Name <input name="firstName" required /></label>
                  <label>Last Name <input name="lastName" required /></label>
                </div>
                <div class="grid-2">
                  <label>Email <input name="email" type="email" required /></label>
                  <label>
                    Role
                    <select name="role">
                      <option value="owner">owner</option>
                      <option value="admin">admin</option>
                      <option value="agent">agent</option>
                      <option value="viewer">viewer</option>
                    </select>
                  </label>
                </div>
                <label>Password <input name="password" type="password" minlength="8" required /></label>
                <label><input type="checkbox" name="isActive" checked /> Active user</label>
                <button type="submit">Create User</button>
              </form>
            </article>

            <article class="card">
              <h2>Change Password</h2>
              <form id="password-form" class="stack">
                <label>User <select id="password-user-id" name="userId" required></select></label>
                <label>New Password <input name="newPassword" type="password" minlength="8" required /></label>
                <button type="submit">Update Password</button>
              </form>
              <div class="soft-box">
                Users can later change their own password from profile flows.
              </div>
            </article>
          </section>

          <section class="card">
            <h2>Users</h2>
            <div id="user-list" class="table-wrap"></div>
          </section>

          <div id="toast" class="toast hidden" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <script src="/common.js?v=20260314"></script>
    <script src="/users.js?v=20260314"></script>
  </body>
</html>
